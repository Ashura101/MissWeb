<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <!-- Ball of Yarn -->
  <g transform="translate(100, 75)">
    <circle cx="0" cy="0" r="22" fill="#a7f3d0" stroke="#6ee7b7" stroke-width="2"/>
    <!-- Yarn winding lines -->
    <path d="M -16 -8 C -4 -18 10 -15 18 -6" stroke="#34d399" stroke-width="2.5" fill="none"/>
    <path d="M -18 4 C -6 16 12 14 18 2" stroke="#34d399" stroke-width="2.5" fill="none"/>
    <path d="M -8 -18 C 6 -6 8 12 -4 18" stroke="#34d399" stroke-width="2.5" fill="none"/>
    <!-- Loose Yarn String -->
    <path d="M -6 20 C -20 30 -40 22 -55 24 C -70 26 -78 20 -85 10" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Playful Kitten -->
  <g transform="translate(45, 65)">
    <!-- Curled Playful Body -->
    <ellipse cx="0" cy="15" rx="24" ry="18" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.8"/>
    <!-- Calico Patch -->
    <path d="M -10 5 C 0 -2 12 0 10 12 C 5 20 -5 18 -10 5 Z" fill="#f4a261"/>

    <!-- Paws reaching forward toward yarn -->
    <ellipse cx="22" cy="12" rx="7" ry="5" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.5"/>
    <ellipse cx="20" cy="22" rx="7" ry="5" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.5"/>

    <!-- Kitten Head -->
    <ellipse cx="-4" cy="-5" rx="20" ry="18" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.8"/>
    <!-- Ears -->
    <polygon points="-18,-15 -24,-30 -8,-22" fill="#6c584c"/>
    <polygon points="4,-22 18,-30 14,-15" fill="#f4a261"/>

    <!-- Playful Wide Curious Eyes -->
    <ellipse cx="-10" cy="-6" rx="4" ry="5" fill="#2b2d42"/>
    <circle cx="-11" cy="-8" r="1.6" fill="#ffffff"/>

    <ellipse cx="4" cy="-6" rx="4" ry="5" fill="#2b2d42"/>
    <circle cx="3" cy="-8" r="1.6" fill="#ffffff"/>

    <!-- Nose and Mouth -->
    <polygon points="-3,-1 -1,-1 -2,1" fill="#ff758c"/>
    <path d="M -5 3 Q -2 5 1 3" stroke="#4a3b32" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Whiskers -->
    <line x1="-18" y1="-2" x2="-28" y2="-4" stroke="#a38c82" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-18" y1="2" x2="-27" y2="4" stroke="#a38c82" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="10" y1="-2" x2="20" y2="-4" stroke="#a38c82" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="10" y1="2" x2="19" y2="4" stroke="#a38c82" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Tail in Air -->
    <path d="M -24 16 C -34 10 -36 -2 -28 -12" stroke="#f4a261" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
