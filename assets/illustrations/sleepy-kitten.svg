<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <!-- Fluffy Cloud -->
  <g fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2">
    <ellipse cx="80" cy="100" rx="60" ry="24"/>
    <circle cx="48" cy="85" r="24"/>
    <circle cx="78" cy="74" r="28"/>
    <circle cx="112" cy="84" r="22"/>
  </g>

  <!-- Stars -->
  <path d="M 32 45 L 34 50 L 39 52 L 34 54 L 32 59 L 30 54 L 25 52 L 30 50 Z" fill="#fde047"/>
  <path d="M 128 40 L 130 44 L 134 45 L 130 46 L 128 50 L 126 46 L 122 45 L 126 44 Z" fill="#fde047"/>

  <!-- Sleeping Kitty -->
  <ellipse cx="80" cy="78" rx="30" ry="20" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.8"/>
  <path d="M 68 68 C 72 62 82 62 84 70 C 80 75 70 76 68 68 Z" fill="#f4a261"/>
  
  <!-- Kitty Head -->
  <ellipse cx="98" cy="72" rx="16" ry="14" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.8"/>
  <polygon points="98,62 106,50 108,63" fill="#f4a261"/>
  <polygon points="107,63 115,53 113,66" fill="#6c584c"/>

  <!-- Sleeping Eyes -->
  <path d="M 94 72 Q 97 75 100 72" stroke="#4a3b32" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 104 72 Q 107 75 110 72" stroke="#4a3b32" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Blush -->
  <circle cx="93" cy="76" r="3" fill="#ffccd5"/>
  <circle cx="111" cy="76" r="3" fill="#ffccd5"/>

  <!-- Tail curled -->
  <path d="M 52 82 C 45 75 50 68 55 72" stroke="#f4a261" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Floating 'zzz' -->
  <text x="116" y="52" font-family="'Fredoka', cursive" font-size="12" fill="#ff85a1" font-weight="700">z</text>
  <text x="124" y="42" font-family="'Fredoka', cursive" font-size="15" fill="#ff85a1" font-weight="700">Z</text>
</svg>
