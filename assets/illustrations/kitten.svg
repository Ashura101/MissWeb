<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="100%" height="100%">
  <!-- Kitten Curled Body -->
  <g class="kitten-body">
    <!-- Tail -->
    <path class="kitten-tail" d="M 28 65 C 10 65 4 45 14 36 C 22 28 26 40 22 48 C 18 56 25 60 35 60 Z" fill="#e76f51"/>

    <!-- Calico Body -->
    <ellipse cx="65" cy="62" rx="42" ry="26" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.5"/>
    <!-- Calico Patches on Body -->
    <path d="M 40 48 C 45 42 58 40 60 52 C 60 62 48 64 38 60 Z" fill="#f4a261"/>
    <path d="M 80 50 C 88 44 98 48 95 58 C 92 65 82 66 78 58 Z" fill="#6c584c"/>

    <!-- Resting Paws -->
    <ellipse cx="50" cy="82" rx="10" ry="7" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.5"/>
    <ellipse cx="70" cy="82" rx="10" ry="7" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.5"/>
  </g>

  <!-- Kitten Head -->
  <g class="kitten-head">
    <!-- Ears -->
    <polygon class="kitten-ear-left" points="75,32 62,8 90,20" fill="#f4a261"/>
    <polygon points="73,28 66,14 84,21" fill="#ffccd5"/>

    <polygon class="kitten-ear-right" points="110,32 125,8 100,20" fill="#6c584c"/>
    <polygon points="112,28 120,14 104,21" fill="#ffccd5"/>

    <!-- Head Base -->
    <ellipse cx="94" cy="42" rx="28" ry="24" fill="#fffdfa" stroke="#e0d6ce" stroke-width="1.5"/>
    <!-- Head Calico Patch -->
    <path d="M 75 25 C 80 20 92 24 90 35 C 85 40 76 35 75 25 Z" fill="#f4a261"/>

    <!-- Cute Curved Sleeping Eyes -->
    <path d="M 82 42 Q 87 47 92 42" stroke="#4a3b32" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 100 42 Q 105 47 110 42" stroke="#4a3b32" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Tiny Pink Nose & Mouth -->
    <polygon points="95,47 98,47 96.5,49" fill="#ff758c"/>
    <path d="M 94.5 51 Q 96.5 53 98.5 51" stroke="#4a3b32" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- Whiskers -->
    <line x1="74" y1="46" x2="62" y2="44" stroke="#a38c82" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="75" y1="49" x2="63" y2="51" stroke="#a38c82" stroke-width="1.4" stroke-linecap="round"/>

    <line x1="116" y1="46" x2="128" y2="44" stroke="#a38c82" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="115" y1="49" x2="127" y2="51" stroke="#a38c82" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="80" cy="47" rx="5" ry="3.5" fill="#ffb4a2" opacity="0.6"/>
    <ellipse cx="112" cy="47" rx="5" ry="3.5" fill="#ffb4a2" opacity="0.6"/>
  </g>
</svg>
